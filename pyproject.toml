[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blg-model-builder"
version = "0.2.0"
description = "Bilayer graphene model builder: LAMMPS Python interface and tight-binding UQ workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "ase>=3.22"]
authors = [
  {name = "Daniel", email = "unknown@example.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "ase>=3.22"]

[project.urls]
Homepage = "https://github.com/dpalmer-anl/BLG_model_builder"

[tool.pytest.ini_options]
markers = [
  "slow: optional tests that are expensive (e.g. large-cell relaxations).",
]

[tool.setuptools]
packages = ["blg_model_builder"]
package-dir = { "blg_model_builder" = "src" }
