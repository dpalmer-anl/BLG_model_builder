[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blg-model-builder-v2"
version = "0.1.0"
description = "Bilayer graphene model builder: LAMMPS Python interface for KC-Full, Tersoff, DRIP, and POD potentials"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "ase>=3.22"]
authors = [
  {name = "Daniel", email = "unknown@example.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "ase>=3.22"]

[project.urls]
Homepage = "https://example.com/blg-model-builder-v2"

[tool.pytest.ini_options]
markers = [
  "slow: optional tests that are expensive (e.g. large-cell relaxations).",
]

[tool.setuptools]
# Map the importable package name "blg_model_builder_v2" to the src/ directory.
packages = ["blg_model_builder_v2"]
package-dir = { "blg_model_builder_v2" = "src" }
