# Allegro config — strained bilayer graphene (rVV10)
# Auto-generated by fit_allegro_and_relax.py
# Train/test match DataLoader.train_test_split (POD MCMC); val ⊂ train.
# Energy-only training (no forces / stress).

run: [train, test]

seed: 42
cutoff_radius: 6.0
model_type_names: [C]

data:
  _target_: nequip.data.datamodule.ASEDataModule
  seed: ${seed}
  train_file_path: /mnt/c/Users/Daniel/Documents/research/BLG_model_builder/uncertainty_quantification/allegro_blg_rcut6/splits/train.xyz
  val_file_path: /mnt/c/Users/Daniel/Documents/research/BLG_model_builder/uncertainty_quantification/allegro_blg_rcut6/splits/val.xyz
  test_file_path: /mnt/c/Users/Daniel/Documents/research/BLG_model_builder/uncertainty_quantification/allegro_blg_rcut6/splits/test.xyz
  exclude_keys: [forces, force, stress]
  transforms:
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      model_type_names: ${model_type_names}
      chemical_species_to_atom_type_map:
        C: C
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 4
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 8
  test_dataloader: ${data.val_dataloader}
  stats_manager:
    _target_: nequip.data.EnergyOnlyDataStatisticsManager
    type_names: ${model_type_names}

trainer:
  _target_: lightning.Trainer
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ""
    version: 0
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val0_epoch/weighted_sum
      mode: min
      dirpath: ${hydra:runtime.output_dir}
      filename: best
      save_last: true
    - _target_: nequip.train.callbacks.TestTimeXYZFileWriter
      out_file: ${hydra:runtime.output_dir}/test_predictions
      output_fields_from_original_dataset: [total_energy]
      chemical_symbols: [C]
    - _target_: nequip.train.callbacks.LossCoefficientMonitor
      interval: epoch
      frequency: 10

num_scalar_features: 8

training_module:
  _target_: nequip.train.EMALightningModule
  loss:
    _target_: nequip.train.EnergyOnlyLoss
    per_atom_energy: true
  val_metrics:
    _target_: nequip.train.EnergyOnlyMetrics
    coeffs:
      per_atom_energy_mae: 1.0
      total_energy_mae: null
      per_atom_energy_rmse: null
      total_energy_rmse: null
      per_atom_energy_maxabserr: null
      total_energy_maxabserr: null
  test_metrics: ${training_module.val_metrics}
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001

  model:
    _target_: allegro.model.AllegroModel
    seed: 42
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}
    radial_chemical_embed:
      _target_: allegro.nn.TwoBodyBesselScalarEmbed
      num_bessels: 8
      bessel_trainable: false
      polynomial_cutoff_p: 6
    l_max: 1
    parity: true
    num_layers: 1
    num_scalar_features: ${num_scalar_features}
    num_tensor_features: 8
    allegro_mlp_hidden_layers_width: 8
    readout_mlp_hidden_layers_width: 8
    avg_num_neighbors: ${training_data_stats:per_type_num_neighbors_mean}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales: ${training_data_stats:total_energy_std}
